name: Deploy Vite build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite application
        run: npm run build
        env:
          VITE_VAPI_PUBLIC_KEY: ${{ vars.VITE_VAPI_PUBLIC_KEY }}
          VITE_VAPI_ASSISTANT_ID: ${{ vars.VITE_VAPI_ASSISTANT_ID }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy compiled application
        id: deployment
        uses: actions/deploy-pages@v4
